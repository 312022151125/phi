name: Release

on:
  push:
    tags:
      - 'v*'          # 匹配 v1.0.0, v0.2.3 等
      - 'v*-*'        # 匹配 v1.0.0-alpha, v2.0.0-rc1 等

permissions:
  contents: write      # 允许创建 Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史用于 changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run tests
        run: make test

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
