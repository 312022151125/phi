name: Publish Rust crate

# The Rust crate owns the ext/rust/v* tag namespace: crates.io rejects a
# re-published version, so the crate must bump independently of the Go SDK
# (which keeps releasing under ext/go/v*, untouched) and of the phi binaries.
on:
  push:
    tags:
      # matches ext/rust/v0.1.0, ext/rust/v0.2.0, ...
      - 'ext/rust/v*'
      # matches ext/rust/v0.2.0-rc1, ... (mirrors the v*-* pattern in release.yml)
      - 'ext/rust/v*-*'

permissions:
  contents: read

jobs:
  cargo-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Fail closed on a tag that disagrees with the crate version: publishing
      # the wrong version would burn it on crates.io.
      - name: Check tag matches crate version
        id: manifest
        working-directory: ext/rust
        run: |
          NAME="$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "${GITHUB_REF_NAME#ext/rust/}" != "v${VERSION}" ]; then
            echo "error: tag ${GITHUB_REF_NAME}: expected ext/rust/v${VERSION} per ext/rust/Cargo.toml" >&2
            echo "       bump the crate version and retag, then push the tag again" >&2
            exit 1
          fi
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Re-running a finished release would otherwise fail on crates.io's
      # "already published" error; treat it as a no-op instead.
      - name: Check version is not yet published
        id: published
        env:
          NAME: ${{ steps.manifest.outputs.name }}
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if curl -sf -A "phi-publish-ci" \
            "https://crates.io/api/v1/crates/${NAME}/${VERSION}" > /dev/null; then
            echo "exists=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "exists=false" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Publish to crates.io
        if: steps.published.outputs.exists == 'false'
        working-directory: ext/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "error: secrets.CARGO_REGISTRY_TOKEN is not set" >&2
            echo "       create a crates.io API token and add it as a repository secret" >&2
            exit 1
          fi
          cargo publish
